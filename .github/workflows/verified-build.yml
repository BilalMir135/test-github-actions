name: Verified Build (tag-triggered)

# Fires only on per-program version tags, e.g.:
#   program-one-v1.0.0
#   program-two-v0.3.2
# The tag prefix decides WHICH program is built. Pushing one tag builds one program.
on:
  push:
    tags:
      - "program-one-v*"
      - "program-two-v*"

# Never run two builds for the same tag at once.
concurrency:
  group: verified-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── JOB 1: no environment, so it runs immediately ──
  verify-source:
    runs-on: ubuntu-latest
    outputs:
      program: ${{ steps.resolve.outputs.program }}
      version: ${{ steps.resolve.outputs.version }}
      lib:     ${{ steps.resolve.outputs.lib }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # required — default depth 1 has no main history

      - name: Verify tag source      # ← the step you asked about
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ...

      - name: Resolve target program from tag
        id: resolve
        run: |
          ...   # your existing resolve step, moved here

  # ── JOB 2: gated, waits for two approvals ──
  verified-build:
    runs-on: ubuntu-latest

    # THIS LINE is the approval gate. The job starts, then PAUSES here until a
    # required reviewer of the `mainnet` environment approves it in the Actions UI.
    # Nothing below runs until approval.
    # NOTE: GitHub only ENFORCES environment required-reviewers on public repos,
    # or on private repos under a paid plan (Pro/Team/Enterprise). On a private
    # Free-plan repo the rule is silently ignored and the job runs immediately.
    environment: mainnet

    steps:
      - name: Checkout (at the tagged commit)
        uses: actions/checkout@v4

      - name: Resolve target program from tag
        id: resolve
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"                 # e.g. program-one-v1.0.0
          PROGRAM="${TAG%-v*}"                      # program-one
          VERSION="${TAG##*-v}"                     # 1.0.0
          LIB="${PROGRAM//-/_}"                     # program_one  (crate/lib name)

          if [ ! -d "programs/${PROGRAM}" ]; then
            echo "::error::No directory programs/${PROGRAM} for tag ${TAG}"
            exit 1
          fi

          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "program=$PROGRAM"  >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "lib=$LIB"          >> "$GITHUB_OUTPUT"

          echo "### Build request" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`$TAG\`"         >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`$GITHUB_SHA\`"  >> "$GITHUB_STEP_SUMMARY"
          echo "- **Program:** \`$PROGRAM\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI (Agave)
        run: |
          set -euo pipefail
          # Uses current stable platform-tools (edition2024-capable), unlike the
          # old pinned image in `solana-verify build`. If this ever fails to
          # compile, pin the exact version you build with locally, e.g.
          #   https://release.anza.xyz/v2.3.0/install
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          set -euo pipefail
          solana --version
          cargo-build-sbf --version

      - name: Cache cargo + sbf target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: sbf-${{ runner.os }}-${{ steps.resolve.outputs.lib }}-${{ hashFiles('Cargo.lock') }}

      - name: Build program (${{ steps.resolve.outputs.lib }})
        run: |
          set -euo pipefail
          # Build ONLY the tagged program's crate.
          cargo build-sbf --manifest-path "programs/${{ steps.resolve.outputs.program }}/Cargo.toml"

      - name: Install solana-verify (for hashing only)
        run: |
          set -euo pipefail
          if ! command -v solana-verify >/dev/null 2>&1; then
            cargo install solana-verify --locked
          fi
          solana-verify --version

      - name: Compute & log verifier hash
        run: |
          set -euo pipefail
          SO="target/deploy/${{ steps.resolve.outputs.lib }}.so"
          if [ ! -f "$SO" ]; then
            echo "::error::Expected artifact $SO not found"
            ls -R target/deploy || true
            exit 1
          fi

          HASH="$(solana-verify get-executable-hash "$SO")"

          echo "=================================================="
          echo " PROGRAM        : ${{ steps.resolve.outputs.program }}"
          echo " VERSION        : ${{ steps.resolve.outputs.version }}"
          echo " ARTIFACT       : $SO"
          echo " VERIFIER HASH  : $HASH"
          echo "=================================================="

          {
            echo "- **Artifact:** \`$SO\`"
            echo "- **Verifier hash:** \`$HASH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # In the real pipeline, the next steps (behind this same gate) would be:
      #   - solana program write-buffer target/deploy/<lib>.so
      #   - solana program set-buffer-authority <buffer> --new-buffer-authority <multisig>
      #   - create the Squads upgrade proposal referencing the buffer
